<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Go2upSkills</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
    </head>

    <body>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-5">
                <a class="navbar-brand" href="Home.html">Go2upSkills</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="Home.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="Course.html">Course</a></li>
                        <li class="nav-item"><a class="nav-link" href="Register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <section class="vh-100 gradient-custom">
            <div class="container py-5 h-90">
              <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-lg-9 col-xl-7">
                  

                      <h2 class="mb-4 pb-2 pb-md-0 mb-md-5">Register</h3>
                      <form>
          
                        <div class="row">
                          <div class="col-md-6 mb-4">
          
                            <div data-mdb-input-init class="form-outline">
                              <input type="text" id="fullName" class="form-control form-control-lg" />
                              <label class="form-label" for="firstName">Full Name</label>
                            </div>
          
                          </div>
                    
                        </div>
          
                       
          
                        <div class="row">
                          <div class="col-md-6 mb-4 pb-2">
          
                            <div data-mdb-input-init class="form-outline">
                              <input type="email" id="emailAddress" class="form-control form-control-lg" />
                              <label class="form-label" for="emailAddress">Email</label>
                            </div>
          
                          </div>
                          <div class="col-md-6 mb-4 pb-2">
          
                            <div data-mdb-input-init class="form-outline">
                              <input type="tel" id="phoneNumber" class="form-control form-control-lg" />
                              <label class="form-label" for="phoneNumber">Phone Number</label>
                            </div>
          
                          </div>
                        </div>
          
                        <div class="row">
                          <div class="col-12">
                            <label class="form-label select-label">Select Course</label>
                            <select class="select form-control-lg">
                              <option value="1" disabled>Select Course</option>
                              <option value="2">Course 1</option>
                              <option value="3">Course 2</option>
                              <option value="4">Course 3</option>
                              <option value="4">Course 4</option>
                              <option value="4">Course 5</option>
                              <option value="4">Course 6</option>
                            </select>
                            
          
                          </div>
                        </div>
          
                        <div class="mt-4 pt-2">
                          <input data-mdb-ripple-init class="btn btn-primary btn-lg" type="submit" value="Submit" />
                        </div>
          
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
          
          <footer>
            <div id="footer-placeholder"></div>
        </footer>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
            fetch("menu.html")
                .then(res => res.text())
                .then(data => { document.getElementById("menu-container").innerHTML = data; });

            fetch("footer.html")
                .then(res => res.text())
                .then(data => { document.getElementById("footer-placeholder").innerHTML = data; });
        });
    </script>
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
    </body>
</html>
